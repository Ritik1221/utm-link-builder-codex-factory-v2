name: codex-agent
run-name: codex-${{ inputs.invocation_id }}

on:
  workflow_dispatch:
    inputs:
      invocation_id:
        description: Content-addressed factory invocation id
        required: true
        type: string
      not_after:
        description: Epoch milliseconds after which the isolated runner must not start Codex
        required: true
        type: string

concurrency:
  group: codex-${{ inputs.invocation_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      base_sha: ${{ steps.invocation.outputs.base_sha }}
      role: ${{ steps.invocation.outputs.role }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: control
          persist-credentials: false
      - id: invocation
        run: node control/.github/factory/runner/prepare-codex-job.mjs fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_INVOCATION_ID: ${{ inputs.invocation_id }}
          FACTORY_INVOCATION_PATH: ${{ runner.temp }}/factory-input/invocation.json
          FACTORY_DISPATCHER_LOGIN: ${{ vars.FACTORY_DISPATCHER_LOGIN || 'github-actions[bot]' }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.invocation.outputs.base_sha }}
          path: source
          persist-credentials: false
      - run: node control/.github/factory/runner/prepare-codex-job.mjs package
        env:
          FACTORY_INVOCATION_PATH: ${{ runner.temp }}/factory-input/invocation.json
          FACTORY_SOURCE_ROOT: ${{ github.workspace }}/source
          FACTORY_INPUT_ROOT: ${{ runner.temp }}/factory-input
          FACTORY_NOT_AFTER: ${{ inputs.not_after }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-input-${{ inputs.invocation_id }}
          path: ${{ runner.temp }}/factory-input
          retention-days: 7
          if-no-files-found: error

  execute:
    needs: prepare
    runs-on: [self-hosted, factory-codex-isolated]
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-input-${{ inputs.invocation_id }}
          path: ${{ runner.temp }}/factory-input
      # This root-owned launcher is installed from an owner-approved factory
      # commit. It runs the Codex child as a dedicated OS account. No repository
      # checkout, GitHub token or Actions credential is passed to that child.
      - name: Execute isolated Codex invocation
        run: >-
          sudo -n /usr/local/libexec/factory-codex/execute
          "${{ runner.temp }}/factory-input"
          "${{ runner.temp }}/factory-result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-result-${{ inputs.invocation_id }}
          path: ${{ runner.temp }}/factory-result
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [prepare, execute]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: publish
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-input-${{ inputs.invocation_id }}
          path: ${{ runner.temp }}/factory-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-result-${{ inputs.invocation_id }}
          path: ${{ runner.temp }}/factory-result
      # Exits non-zero after publishing any result other than completed.
      # The publisher PAT is exposed only to this trusted script. It is used for
      # branch push and PR creation, never passed to checkout or the agent job.
      - run: node control/.github/factory/runner/publish-codex-result.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_PUBLISH_TOKEN: ${{ secrets.FACTORY_PUBLISH_TOKEN }}
          FACTORY_PUBLISHER_LOGIN: ${{ vars.FACTORY_PUBLISHER_LOGIN }}
          FACTORY_INVOCATION_ID: ${{ inputs.invocation_id }}
          FACTORY_DISPATCHER_LOGIN: ${{ vars.FACTORY_DISPATCHER_LOGIN || 'github-actions[bot]' }}
          FACTORY_INPUT_ROOT: ${{ runner.temp }}/factory-input
          FACTORY_RESULT_ROOT: ${{ runner.temp }}/factory-result
          FACTORY_PUBLISH_ROOT: ${{ github.workspace }}/publish

  # Exactly one bounded wake-up belongs to each transport workflow run. Result
  # publication itself is idempotent and never recursively dispatches workflows.
  # This also wakes recovery when execute or publish failed.
  reconcile:
    needs: [prepare, execute, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run factory.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
